name: tests

on:
  # `master` is what has been released; `release/**` is where the next
  # release is assembled from pull requests, and needs the same gate.
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]
  # Manual re-run after GitHub Actions infra flakes without a no-op commit.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the runs for its older commits, which
# otherwise hold the few macOS runners for hours. Pushes to master and
# release branches each keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Rust workspace on every OS: formatting, lints and tests. Vahta has no
  # Python part; key-amnesia's Python suite is tested on master only.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      # The detector's rule file is tested on its own, and only when it or its
      # crate changed: hundreds of rule samples need not run on every PR.
      - name: Did the rules change
        id: rules
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          changed=false
          if [ -d crates/rules ]; then
            if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
              || ! git fetch --depth 1 origin "${BASE}" 2>/dev/null; then
              changed=true
            elif git diff --name-only "${BASE}" HEAD | grep -q '^crates/rules/'; then
              changed=true
            fi
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "rules changed: ${changed}"

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The vault's cheap test KDF exists so tests need not spend a gigabyte per
      # unlock, and the daemon's `test-surface` feature lets a test drive a real
      # daemon with a scripted prompt window instead of a person and a terminal.
      # If a shipped crate ever turned either on, a vault could be made with a
      # weak password hash or a prompt answered by a script, so no build of the
      # CLI may see either feature.
      - name: No test-only features in the shipped CLI
        run: |
          set -euo pipefail
          if cargo tree -p vahta-cli -e features,normal,build --prefix none | grep -Eq 'test-kdf|test-surface'; then
            echo "a test-only feature (test-kdf, test-surface) is enabled in vahta-cli" >&2
            cargo tree -p vahta-cli -e features,normal,build -i vahta-vault >&2
            cargo tree -p vahta-cli -e features,normal,build -i vahta-daemon >&2
            exit 1
          fi
          echo "no test-only feature is enabled in vahta-cli"

      # The workspace forbids unsafe code (`unsafe_code = "forbid"` in the
      # workspace lints). `vahta-os` is the one crate that may contain it, for
      # operating-system calls only, so: every other crate keeps
      # `[lints] workspace = true`, and `unsafe` appears in no source outside
      # crates/os.
      - name: Unsafe code only in vahta-os
        run: |
          set -euo pipefail
          bad=0
          for manifest in crates/*/Cargo.toml; do
            case "$(dirname "$manifest")" in
              crates/os) continue ;;
            esac
            if ! tr -d '\r' < "$manifest" | awk '/^\[lints\]$/ { getline n; if (n == "workspace = true") ok = 1 } END { exit !ok }'; then
              echo "$manifest must contain [lints] workspace = true" >&2
              bad=1
            fi
          done
          # Comments may mention the word; code may not.
          found=$(grep -rnwE 'unsafe' --include='*.rs' crates \
            | grep -v '^crates/os/' \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
          if [ -n "$found" ]; then
            echo "unsafe outside crates/os:" >&2
            echo "$found" >&2
            bad=1
          fi
          # Inside crates/os every unsafe block needs its SAFETY comment; clippy's
          # undocumented_unsafe_blocks (denied in that crate) enforces it on each
          # platform's build.
          exit "$bad"

      - name: Test
        env:
          RULES: ${{ steps.rules.outputs.changed }}
        run: |
          set -euo pipefail
          if [ -d crates/rules ] && [ "${RULES}" != "true" ]; then
            cargo test --no-fail-fast --workspace --exclude vahta-rules
          else
            cargo test --no-fail-fast --workspace
          fi

      # The local install script, against a throwaway prefix and HOME so it
      # cannot touch the runner's own configs. Cargo and rustup keep their real
      # homes. No setup step: no harness is installed here.
      - name: Local install script
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$(mktemp -d)"
          scripts/install-local.sh --prefix "$RUNNER_TEMP/vahta-bin" --no-setup
          test -x "$RUNNER_TEMP/vahta-bin/vahta" && test -x "$RUNNER_TEMP/vahta-bin/vh" && test -x "$RUNNER_TEMP/vahta-bin/vahta-hook"
          scripts/install-local.sh --prefix "$RUNNER_TEMP/vahta-bin" --uninstall
          test ! -e "$RUNNER_TEMP/vahta-bin/vahta" && test ! -e "$RUNNER_TEMP/vahta-bin/vh" && test ! -e "$RUNNER_TEMP/vahta-bin/vahta-hook"

      # The checkable promise: the open build cannot make a network request,
      # because nothing in its dependency tree is an HTTP or TLS client.
      # Dependencies are welcome; network-capable ones are not.
      - name: No network client in the dependency tree
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          found=$(cargo tree --workspace --edges normal,build --prefix none \
            | sed 's/ .*//' | sort -u \
            | grep -Ex 'reqwest|hyper|hyper-util|ureq|curl|curl-sys|isahc|surf|attohttpc|h2|rustls|native-tls|openssl|openssl-sys' || true)
          if [ -n "$found" ]; then
            echo "network-capable crates in the tree:" >&2
            echo "$found" >&2
            exit 1
          fi
          echo "no network client in the dependency tree"
