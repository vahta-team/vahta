name: tests

on:
  # `master` is what has been released; `release/**` is where the next
  # release is assembled from pull requests, and needs the same gate.
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]
  # Manual re-run after GitHub Actions infra flakes without a no-op commit.
  # UI: Actions → tests → Run workflow → master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
        impl: [python]
        include:
          # The compiled implementation, on one OS and one Python. 3.14 on
          # purpose: the detector's Unicode tables are read out of CPython
          # 3.14 (Unicode 16.0), and benchmarks/diff_unicode.py compares them
          # against the running interpreter, so it only agrees on that version.
          - os: ubuntu-latest
            python-version: "3.14"
            impl: rust
    runs-on: ${{ matrix.os }}
    # Cap hung runners; macOS pytest often needs 45-75m (historical greens
    # on master finished in ~1-2h). 30m cancelled healthy jobs mid-suite.
    timeout-minutes: 90
    # No marketplace `uses:` steps: during Actions partial/major outages,
    # "Set up job" fails while resolving action download info even before
    # checkout. Prefer toolcache Python + git fetch; install via uv on miss
    # (macos-latest toolcache currently ships 3.11+ only, not 3.10).
    # uv-managed Pythons are PEP 668 externally-managed — use a seeded venv.
    defaults:
      run:
        shell: bash
    # `python` is each dispatcher's default, so the python legs behave exactly
    # as they did before this variable existed. A missing extension falls back
    # to Python silently, so the rust leg checks it is really in use below.
    env:
      KEY_AMNESIA_DETECT_IMPL: ${{ matrix.impl }}
      KEY_AMNESIA_SCAN_IMPL: ${{ matrix.impl }}
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      - name: Select Python ${{ matrix.python-version }}
        id: py
        run: |
          set -euo pipefail
          VER="${{ matrix.python-version }}"
          case "${{ runner.os }}" in
            Linux)   BASE="/opt/hostedtoolcache/Python" ;;
            macOS)   BASE="/Users/runner/hostedtoolcache/Python" ;;
            Windows) BASE="/c/hostedtoolcache/windows/Python" ;;
            *) echo "unsupported OS ${{ runner.os }}" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) ARCH=x64 ;;
            arm64|aarch64) ARCH=arm64 ;;
            *) ARCH=x64 ;;
          esac

          find_toolcache() {
            local cand
            cand=$(ls -d "${BASE}/${VER}".*/${ARCH} 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -z "${cand}" ]; then
              cand=$(ls -d "${BASE}/${VER}".*/* 2>/dev/null | sort -V | tail -n 1 || true)
            fi
            printf '%s' "${cand}"
          }

          resolve_bin() {
            local cand="$1"
            if [ "${{ runner.os }}" = "Windows" ]; then
              printf '%s' "${cand}/python.exe"
            else
              printf '%s' "${cand}/bin/python"
            fi
          }

          CAND=$(find_toolcache)
          if [ -n "${CAND}" ]; then
            PY=$(resolve_bin "${CAND}")
          else
            # uv-managed interpreters are PEP 668 externally-managed; pip needs a venv.
            echo "No toolcache Python ${VER} under ${BASE}; installing via uv + venv" >&2
            ls -la "${BASE}" >&2 || true
            if ! command -v uv >/dev/null 2>&1; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="${HOME}/.local/bin:${HOME}/.cargo/bin:${PATH}"
            fi
            # Windows GitHub bash: uv often lands in USERPROFILE\.local\bin
            if ! command -v uv >/dev/null 2>&1; then
              export PATH="${USERPROFILE}/.local/bin:${PATH}"
            fi
            command -v uv
            uv python install "${VER}"
            VENV="${RUNNER_TEMP}/ka-py${VER}"
            # --seed installs pip so later `python -m pip` works (uv venvs omit it by default).
            uv venv --seed --python "${VER}" "${VENV}"
            if [ "${{ runner.os }}" = "Windows" ]; then
              PY="${VENV}/Scripts/python.exe"
            else
              PY="${VENV}/bin/python"
            fi
          fi

          if [ ! -x "${PY}" ] && [ ! -f "${PY}" ]; then
            echo "Python binary missing: ${PY}" >&2
            exit 1
          fi
          echo "python=${PY}" >> "$GITHUB_OUTPUT"
          "${PY}" -V

      - name: Install
        run: |
          set -euo pipefail
          PY="${{ steps.py.outputs.python }}"
          "${PY}" -V
          "${PY}" -m pip install -U pip
          "${PY}" -m pip install -e ".[dev]"

      - name: Build the Rust extensions
        if: matrix.impl == 'rust'
        run: |
          set -euo pipefail
          # Runners ship rustup and a stable cargo. pyo3 needs to know which
          # interpreter to build against.
          export PYO3_PYTHON="${{ steps.py.outputs.python }}"
          cargo --version
          cargo build --release -p vahta-pyext -p vahta-pyext-scan
          cp target/release/lib_detect_rs.so src/key_amnesia/_detect_rs.so
          cp target/release/lib_scan_rs.so src/key_amnesia/_scan_rs.so
          "${{ steps.py.outputs.python }}" - <<'PY'
          from key_amnesia import detect, scan
          assert detect.active_impl == "rust", detect.active_impl
          assert scan.active_impl == "rust", scan.active_impl
          print("detect:", sorted(detect.implemented_natively()))
          print("scan:", sorted(scan.implemented_natively()))
          PY

      - name: Rust tests and Unicode diff
        if: matrix.impl == 'rust'
        run: |
          set -euo pipefail
          export PYO3_PYTHON="${{ steps.py.outputs.python }}"
          cargo test --workspace --release
          cargo build --release -p vahta-detect --example dump_unicode
          "${{ steps.py.outputs.python }}" benchmarks/diff_unicode.py

      # The checkable promise: the open build cannot make a network request,
      # because nothing in its dependency tree is an HTTP or TLS client.
      # Dependencies are welcome; network-capable ones are not.
      - name: No network client in the dependency tree
        if: matrix.impl == 'rust'
        run: |
          set -euo pipefail
          found=$(cargo tree --workspace --edges normal,build --prefix none \
            | sed 's/ .*//' | sort -u \
            | grep -Ex 'reqwest|hyper|hyper-util|ureq|curl|curl-sys|isahc|surf|attohttpc|h2|rustls|native-tls|openssl|openssl-sys' || true)
          if [ -n "$found" ]; then
            echo "network-capable crates in the tree:" >&2
            echo "$found" >&2
            exit 1
          fi
          echo "no network client in the dependency tree"

      - name: Test
        run: |
          set -euo pipefail
          PY="${{ steps.py.outputs.python }}"
          "${PY}" -m pytest -q

  # The Rust workspace on every OS, without Python: formatting, lints and
  # tests. The pyo3 extensions are built and tested by the rust leg above.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude vahta-pyext --exclude vahta-pyext-scan -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude vahta-pyext --exclude vahta-pyext-scan
