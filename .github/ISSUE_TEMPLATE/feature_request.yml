name: Feature request
description: Suggest an improvement to key-amnesia
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — workarounds or other designs you already rejected
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Security-sensitive ideas that describe a vulnerability should go through [SECURITY.md](https://github.com/vahta-team/vahta/blob/master/SECURITY.md), not a public feature request.
