[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "key-amnesia"
version = "0.4.14"
description = "Encrypted secret vault so AI agents can use API keys without seeing them — a drop-in .env replacement"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "key-amnesia contributors" }]
keywords = ["secrets", "credentials", "vault", "ai-agents", "claude", "cursor", "codex", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = [
    "pynacl>=1.5",
    "pyperclip>=1.8",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/fujitoid/key-amnesia"
Documentation = "https://github.com/fujitoid/key-amnesia/wiki"
Repository = "https://github.com/fujitoid/key-amnesia"
Issues = "https://github.com/fujitoid/key-amnesia/issues"
Funding = "https://www.buymeacoffee.com/fujitoid"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
key-amnesia = "key_amnesia.cli:main"
ka = "key_amnesia.cli:main"
key-amnesia-hook = "key_amnesia.hooks.secret_guard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
key_amnesia = ["skills/*/SKILL.md", "hooks/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: process-spawning or otherwise heavy tests; skip with -m 'not slow' for a fast inner loop",
]
