[package]
name = "vahta-pyext"
version = "0.0.0"
description = "Python bindings for the Vahta detector, so the existing suite can run against it"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_detect_rs"
crate-type = ["cdylib"]

[dependencies]
vahta-detect = { path = "../detect" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
