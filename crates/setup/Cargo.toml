[package]
name = "vahta-setup"
version = "0.0.0"
description = "What `vahta setup` does: find a harness, merge our hook entries into its config, undo it"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vahta-harness = { path = "../harness" }
serde_json = { version = "1", features = ["preserve_order"] }
# Unified diffs for `--dry-run`. Pure text; no I/O, no network.
similar = "3"
