[package]
name = "vahta-hook"
version = "0.0.0"
description = "The agent hook: reads a harness event on stdin, answers allow or deny"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "vahta-hook"
path = "src/main.rs"

[dependencies]
vahta-harness = { path = "../harness" }
vahta-detect = { path = "../detect" }
vahta-scan = { path = "../scan" }
vahta-json = { path = "../json" }
# Where each harness keeps its hooks, and how many of our entries a file holds:
# the hook refuses an edit that would weaken them.
vahta-setup = { path = "../setup" }
# The client side of the daemon only: the protocol and the socket, none of
# the vault's cryptography.
vahta-ipc = { path = "../ipc" }
dirs = "6"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
vahta-harness = { path = "../harness" }
