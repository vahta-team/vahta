[package]
name = "vahta-cli"
version = "0.0.0"
description = "The vahta command line: scan a project for secrets an agent can read"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The program is the library, so that `vahta` and its short name `vh` are two
# thin binaries over the same code rather than one file built twice (which
# cargo warns about).
[lib]
name = "vahta_cli"
path = "src/lib.rs"

[[bin]]
name = "vahta"
path = "src/main.rs"

[[bin]]
name = "vh"
path = "src/bin/vh.rs"

[features]
default = ["lock-hyprland", "http"]
# Forwarded to the daemon: the Hyprland lock source. Build with
# `--no-default-features` to leave it out.
lock-hyprland = ["vahta-daemon/lock-hyprland"]
# `vahta http`: the HTTPS client, the only network code in the build (crates/net).
# `--no-default-features` leaves it out, and with it every network crate.
http = ["vahta-daemon/http"]

[dependencies]
vahta-scan = { path = "../scan" }
vahta-harness = { path = "../harness" }
vahta-setup = { path = "../setup" }
dunce = "1"
vahta-vault = { path = "../vault" }
vahta-auth = { path = "../auth" }
vahta-daemon = { path = "../daemon", default-features = false }
vahta-ipc = { path = "../ipc" }
vahta-os = { path = "../os" }
# The prompt window reads a password with the terminal's echo off.
rpassword = "7"
# `--json` output of `vahta list` and `vahta check`.
serde_json = { version = "1", features = ["preserve_order"] }

# `vahta run` forwards Ctrl-C and termination to the command (the daemon runs
# it), and `vahta delegate` stays alive while its command handles Ctrl-C.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
# The tests build vaults to point the commands at; that needs the cheap KDF.
# A dev-dependency's features are not enabled in a normal build of this crate,
# and CI checks that.
vahta-vault = { path = "../vault", features = ["test-kdf"] }
# The tests drive a real daemon without a person or a terminal: the daemon's
# `test-surface` feature (a scripted prompt surface and a few overrides) is
# switched on for the test build only, like `test-kdf`, and CI checks that.
vahta-daemon = { path = "../daemon", features = ["test-surface"] }
# The device tests read the software phone's keys and write device records.
vahta-auth = { path = "../auth", features = ["test-surface"] }
# The phone link tests pair and answer with a software phone over loopback.
vahta-link = { path = "../link" }
vahta-mobile = { path = "../mobile", features = ["fake-phone"] }
# The tests' HTTPS server for `vahta http`, with a throwaway certificate; its
# `test-roots` feature, like `test-surface`, is checked out of the shipped tree
# by CI.
vahta-net = { path = "../net", features = ["test-roots"] }
