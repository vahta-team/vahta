[package]
name = "vahta-cli"
version = "0.0.0"
description = "The vahta command line: scan a project for secrets an agent can read"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
