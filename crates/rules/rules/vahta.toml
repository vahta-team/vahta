# Our own rules, the shared allow-list and the samples for the imported rules.
# The imported rules are in imported.toml and are generated; this file is edited
# by hand. A sample is written as pieces joined at load (`parts`), so this file
# never holds a credential-shaped string.

[common]
# Words that mark a value as made up. A value containing one is let through.
stopwords = ["example", "placeholder", "changeme", "xxxxxxxx"]
# A template slot is not a value: {name}, <name>, [name].
regexes = [
  '^\{[A-Za-z_][A-Za-z0-9_.]*\}$',
  '^<[^<>\s]+>$',
  '^\[[A-Za-z_][A-Za-z0-9_.-]*\]$',
  # user:{password}, the login forms of curl -u and URLs
  '^[^:\s]+:(?:\{[A-Za-z_][A-Za-z0-9_.]*\}|<[^<>\s]+>)$',
]

