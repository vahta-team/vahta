[package]
name = "vahta-daemon"
version = "0.0.0"
description = "The Vahta daemon: the vault's only owner, sessions, the prompt window and `vahta run`"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["lock-hyprland"]
# The Hyprland lock source (Linux): asks the compositor's socket whether a lock
# screen holds a monitor. Off, the build has logind alone.
lock-hyprland = []
# Lets a test drive the daemon without a person and a terminal: a scripted
# prompt surface, the cheap vault KDF and a few overrides of timing. Never
# enabled by any shipped crate; CI fails if `vahta-cli` ever sees it.
test-surface = ["vahta-vault/test-kdf", "vahta-net/test-roots", "vahta-auth/test-surface"]
# `vahta http`: the HTTPS client (crates/net). Off, the daemon answers an http
# request with "this build has no network support" and no network crate is in
# the build. The `vahta` binary has it by default.
http = ["vahta-net/client"]

[dependencies]
# The release list of let-through output values: HMAC-SHA256 under a key
# drawn at start (both already in the tree through vahta-vault).
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vahta-auth = { path = "../auth" }
vahta-detect = { path = "../detect" }
dunce = "1"
vahta-harness = { path = "../harness" }
vahta-ipc = { path = "../ipc" }
# The phone link: Bluetooth LE and LAN transports, the Noise channel, pairing.
vahta-link = { path = "../link" }
vahta-os = { path = "../os" }
vahta-policy = { path = "../policy" }
# The strict URL parser always; the client only with the `http` feature.
vahta-net = { path = "../net" }
# Taking Vahta's hook entries out for a pause and putting them back.
vahta-setup = { path = "../setup" }
vahta-vault = { path = "../vault" }
zeroize = "1"
aho-corasick = "1"

# Linux: logind's PrepareForSleep and Lock signals, over the local system bus
# (a socket in /run, not a network client), to end sessions on suspend and
# screen lock.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
tempfile = "3"
# A phone for the link tests, and its P-256 (the version the auth crate uses).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
vahta-mobile = { path = "../mobile", features = ["fake-phone"] }
# The session tests build real vaults; that needs the cheap KDF.
vahta-vault = { path = "../vault", features = ["test-kdf"] }
