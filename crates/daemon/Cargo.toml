[package]
name = "vahta-daemon"
version = "0.0.0"
description = "The Vahta daemon: the vault's only owner, sessions, the prompt window and `vahta run`"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets a test drive the daemon without a person and a terminal: a scripted
# prompt surface, the cheap vault KDF and a few overrides of timing. Never
# enabled by any shipped crate; CI fails if `vahta-cli` ever sees it.
test-surface = ["vahta-vault/test-kdf"]

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
vahta-os = { path = "../os" }
vahta-vault = { path = "../vault" }
zeroize = "1"

# Linux: logind's PrepareForSleep and Lock signals, over the local system bus
# (a socket in /run, not a network client), to end sessions on suspend and
# screen lock.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
tempfile = "3"
# The session tests build real vaults; that needs the cheap KDF.
vahta-vault = { path = "../vault", features = ["test-kdf"] }
