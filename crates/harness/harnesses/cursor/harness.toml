# Cursor. Docs: https://cursor.com/docs/agent/hooks (read 2026-10-01).
# Cursor's payloads are flat and its replies use snake_case.

name = "cursor"
title = "Cursor"
# Bump when what `vahta setup` writes for this harness changes.
setup_version = 1
unnamed_tool_group = "write"

[config]
format = "json"
# Flat layout (docs read 2026-10-01, https://cursor.com/docs/agent/hooks):
# hooks.<event> is an array of {command, matcher?, ...}, no inner group. The
# matcher is a regex; on preToolUse it matches the tool type (Shell, Read,
# Write, MCP:<name>), on beforeReadFile the literals Read / Write.
shape = "flat"

# hooks.json must carry `"version": 1`, or Cursor ignores the file.
[config.require]
key = "version"
value = 1

[config.path]
linux = ["~/.cursor/hooks.json"]
macos = ["~/.cursor/hooks.json"]
windows = ["~/.cursor/hooks.json"]

# The administrator policy users cannot override, for `vahta setup --managed`.
# Docs: https://cursor.com/docs/agent/hooks, "Enterprise hooks" (read 2026-10-08)
[config.managed]
format = "json_settings"

[config.managed.path]
linux = ["/etc/cursor/hooks.json"]
macos = ["/Library/Application Support/Cursor/hooks.json"]
windows = ["C:\\ProgramData\\Cursor\\hooks.json"]

# --- detection --------------------------------------------------------------
# Used by `vahta setup`. Found when any rule matches. `cursor-agent` is the
# command-line agent, `cursor` the editor's launcher; either one has hooks.
[detect]
dirs = ["~/.cursor"]
binaries = ["cursor", "cursor-agent"]

[[events]]
name = "preToolUse"
kind = "before_tool"
# Shell and file writes. MCP is covered by beforeMCPExecution below.
matcher = "Shell|Write"
tool_name = "tool_name"
tool_input = "tool_input"
# The file Write is about; the hook refuses Vahta's own files.
file_path = ["tool_input.file_path", "tool_input.path"]
cwd = "cwd"
session_id = "conversation_id"

# MCP calls bypass preToolUse in Cursor, so they need their own event. Same
# payload keys; tool_name is the bare tool, and `mcp_server_name` marks it.
[[events]]
name = "beforeMCPExecution"
kind = "before_tool"
tool_name = "tool_name"
tool_input = "tool_input"
cwd = "cwd"
session_id = "conversation_id"

# A dedicated read event whose payload carries the file's content, so the
# hook can judge it without opening the file.
[[events]]
name = "beforeReadFile"
kind = "before_read"
file_path = "file_path"
content = "content"
cwd = "cwd"
session_id = "conversation_id"

[[events]]
name = "sessionStart"
kind = "session_start"
# Registered from v1 so that a later, outdated setup has a channel to say so.

[[events]]
name = "beforeSubmitPrompt"
kind = "prompt"
prompt = "prompt"
cwd = "cwd"
session_id = "conversation_id"

[[events]]
name = "postToolUse"
kind = "after_tool"
tool_name = "tool_name"
# The docs say the result arrives JSON-stringified in `tool_output`.
# `tool_response` is accepted as a precaution.
tool_output = ["tool_output", "tool_response"]
cwd = "cwd"
session_id = "conversation_id"

[[tool_groups]]
group = "mcp"
# Cursor names MCP tools "MCP:<tool>" on preToolUse; beforeMCPExecution sends
# the bare tool name but always carries mcp_server_name.
prefixes = ["mcp:", "mcp__"]
marker_fields = ["mcp_server_name"]

[[tool_groups]]
group = "shell"
tools = ["shell", "bash", "powershell"]
text_fields = ["command", "cmd", "script", "code", "contents", "new_string", "content"]

[[tool_groups]]
group = "write"
# Cursor's Write sends the text as `contents`.
tools = ["write", "edit", "multiedit", "apply_patch"]
text_fields = ["command", "cmd", "script", "code", "contents", "new_string", "content"]

[[tool_groups]]
group = "read"
tools = ["read"]

[replies.before_tool.deny]
style = "json"
# `permission` is allow | deny | ask. agent_message goes to the model,
# user_message to the person.
body = { permission = "deny", user_message = "{user_message}", agent_message = "{agent_message}" }

# beforeReadFile: permission allow|deny, user_message shown on deny. Cursor has
# no separate agent field here, so the one message says what to do instead.
[replies.before_read.deny]
style = "json"
body = { permission = "deny", user_message = "{user_message}" }

[replies.prompt.deny]
style = "json"
# continue:false stops the prompt; user_message is shown to the person.
body = { continue = false, user_message = "{user_message}" }

[replies.after_tool.notice]
style = "json"
# The docs list `additional_context` for postToolUse.
body = { additional_context = "{agent_message}" }

# THEORETICAL: not yet verified live; remove this note once checked.
# `updated_mcp_tool_output` rewrites an MCP result (docs read 2026-10-01).
# Cursor has no such field for its own tools, so there is no `redact` here: a
# secret in a Shell or Read result gets the notice above instead. The docs do
# not say whether the field takes a string or an object; the result is given
# back in the shape it arrived in.
[replies.after_tool.redact_mcp]
style = "json"
body = { updated_mcp_tool_output = "{redacted_output}", additional_context = "{agent_message}" }

# Cursor's sessionStart accepts env and additional_context; its docs say user_message
# is accepted but not enforced, so the notice goes to the agent as context, with a
# request to pass it on (docs read 2026-10-01).
[replies.session_start.notice]
style = "json"
body = { additional_context = "{agent_message}" }
