# Claude Code. Docs: https://code.claude.com/docs/en/hooks (read 2026-10-01).
# Hook command receives one JSON object on stdin; we answer on stdout, exit 0.

name = "claude"
title = "Claude Code"
# Bump when what `vahta setup` writes for this harness changes.
# 2: permissions.deny for the vahta commands that are for the person only.
# 3: the after-tool matcher also covers WebFetch.
# 4: permissions.allow for the read-only commands `vahta list` and `vahta check`.
# 5: the prompt hook may wait for the person: timeout 120 s on UserPromptSubmit.
# 6: the SessionEnd hook (the daemon cleans the transcript it marked), and
#    permissions.allow for `vahta scrub --transcript`.
setup_version = 6

# When a payload names no tool at all, scan it like a write: the old Python
# hook did, and "over-cover rather than miss" is the rule for a guard.
unnamed_tool_group = "write"

[config]
format = "json"
# Layout of a registration (docs read 2026-10-01, https://code.claude.com/docs/en/hooks):
# hooks.<Event> is an array of matcher groups {matcher?, hooks: [{type, command}]}.
# `matcher` is optional; setup omits the key for an event without one.
shape = "grouped"

# Claude Code enforces permissions.deny itself, before any hook runs, and a
# deny beats any allow. The hook refuses these commands too (and catches
# spellings a prefix rule cannot: full paths, `bash -c`, `env`); this is the
# second layer. `vh` is the short name of `vahta`.
[config.deny]
key = "permissions.deny"
rules = [
  "Bash(vahta reveal:*)",
  "Bash(vahta copy:*)",
  "Bash(vahta _surface:*)",
  "Bash(vh reveal:*)",
  "Bash(vh copy:*)",
  "Bash(vh _surface:*)",
]

# Exact allow rules for the two commands that only read: `vahta list` and
# `vahta check` peek at the vault and open no window, so an agent running them
# unattended is what Vahta wants. Exact strings, no wildcard, and never `vahta
# run`: a rule on it would also allow `vahta run -- rm -rf`, because the harness
# matches the prefix and cannot see the rules of the secret. `vahta run` is
# allowed by the hook instead, for one command at a time (`allow_explicit`
# below). Not written by `--managed`: an administrator's allow list is the
# person's to choose. (`vahta status` does not exist; the daemon's is `vahta
# daemon status`, which is left to the harness.)
[config.allow]
key = "permissions.allow"
rules = [
  "Bash(vahta list)",
  "Bash(vahta list --json)",
  "Bash(vahta check)",
  "Bash(vahta check --json)",
  "Bash(vh list)",
  "Bash(vh list --json)",
  "Bash(vh check)",
  "Bash(vh check --json)",
  # Removes secrets from the harness's transcript files and reveals nothing,
  # so it is for the agent to run without being asked (exact strings only).
  "Bash(vahta scrub --transcript)",
  "Bash(vahta scrub --transcript --all)",
  "Bash(vahta scrub --transcript --json)",
  "Bash(vh scrub --transcript)",
  "Bash(vh scrub --transcript --all)",
  "Bash(vh scrub --transcript --json)",
]

# User scope only in v1. Hooks live under the "hooks" key of settings.json.
[config.path]
linux = ["~/.claude/settings.json"]
macos = ["~/.claude/settings.json"]
windows = ["~/.claude/settings.json"]

# The administrator policy users cannot override, for `vahta setup --managed`.
# Docs: https://code.claude.com/docs/en/managed-settings (read 2026-10-08)
[config.managed]
format = "json_settings"

[config.managed.path]
linux = ["/etc/claude-code/managed-settings.json"]
macos = ["/Library/Application Support/ClaudeCode/managed-settings.json"]
windows = ["C:\\Program Files\\ClaudeCode\\managed-settings.json"]

# --- detection --------------------------------------------------------------
# Used by `vahta setup`. Found when any rule matches. The config directory is
# what Claude Code creates on first run; the binary covers a fresh install.
[detect]
dirs = ["~/.claude"]
binaries = ["claude"]

# --- events -----------------------------------------------------------------
# `name` is Claude's own event name (written into settings.json by setup).
# Field paths are dotted; a list means "first one present wins".

[[events]]
name = "PreToolUse"
kind = "before_tool"
# Shell and write tools, plus every MCP tool (named mcp__<server>__<tool>).
# MCP is in the matcher because a credential can ride in any MCP argument.
matcher = "Bash|Write|Edit|MultiEdit|mcp__.*"
tool_name = "tool_name"
tool_input = "tool_input"
# The file Write and Edit are about; the hook refuses Vahta's own files.
file_path = ["tool_input.file_path", "tool_input.path"]
cwd = "cwd"
session_id = "session_id"

# Same Claude event, different job: reading a file. Claude has no dedicated
# read event, so reads arrive as PreToolUse on the Read and Grep tools. This is a
# separate entry (not a tool group inside before_tool) because the matcher is
# what setup registers and the hook is told which job it has by --event; Glob
# lists names, never contents, so it is not matched.
[[events]]
name = "PreToolUse"
kind = "before_read"
matcher = "Read|Grep"
tool_name = "tool_name"
file_path = ["tool_input.file_path", "tool_input.path"]
# Read's own window onto the file, for the redacted copy in a refusal.
offset = "tool_input.offset"
limit = "tool_input.limit"
cwd = "cwd"
session_id = "session_id"

[[events]]
name = "SessionStart"
kind = "session_start"
# `compact` after /compact: Claude Code then restores the files it had read.
source = "source"
# Registered from v1 so that a later, outdated setup has a channel to say so.
cwd = "cwd"
session_id = "session_id"

# The session is over: the daemon cleans the transcript it found a secret in
# while the session ran and could not rewrite (docs read 2026-10-16,
# https://code.claude.com/docs/en/hooks; the payload carries session_id, cwd and
# a `reason`). Nothing is answered. No matcher: every reason (clear, logout,
# exit) ends a session.
[[events]]
name = "SessionEnd"
kind = "session_end"
cwd = "cwd"
session_id = "session_id"

[[events]]
name = "UserPromptSubmit"
kind = "prompt"
# The docs do not pin the field down in the text we could read. `prompt` is
# what Claude sends; `user_prompt` is accepted in case a version spells it so.
prompt = ["prompt", "user_prompt"]
cwd = "cwd"
session_id = "session_id"
# A prompt with a secret in it opens a Vahta window and waits for the person
# (false alarm / save to the vault / do nothing). The hook gives up a little
# before this (115 s) and then holds the prompt: it fails closed. Seconds.
timeout = 120

[[events]]
name = "PostToolUse"
kind = "after_tool"
# Claude sends the result as `tool_response` (a string or a structured object
# such as {stdout, stderr}); `tool_output` is accepted too. All strings in it
# are scanned.
matcher = "Bash|Read|Grep|Glob|WebFetch|mcp__.*"
tool_name = "tool_name"
tool_output = ["tool_response", "tool_output"]
cwd = "cwd"
session_id = "session_id"

# --- tool groups ------------------------------------------------------------
# Group order matters: first match wins, MCP first so a server that names a
# tool "bash" is still treated as MCP.

[[tool_groups]]
group = "mcp"
prefixes = ["mcp__"]
# No text_fields: MCP argument names belong to the server. A key called
# `command` must not hide a credential in a sibling argument.

# The text keys below are tried in this order and the first non-empty one is
# scanned alone. Both shell and write share one list: Codex's apply_patch
# carries a patch under `command`, Write carries `content`, and an unknown
# tool shape falls back to scanning every string.
[[tool_groups]]
group = "shell"
tools = ["bash", "shell", "powershell"]
text_fields = ["command", "cmd", "script", "code", "contents", "new_string", "content"]

[[tool_groups]]
group = "write"
tools = ["write", "edit", "multiedit", "apply_patch"]
text_fields = ["command", "cmd", "script", "code", "contents", "new_string", "content"]

[[tool_groups]]
group = "read"
tools = ["read", "grep"]

# --- replies ----------------------------------------------------------------
# Silence with exit 0 is allow. Placeholders: {reason} (= {agent_message}),
# {user_message}, {agent_message}.

[replies.before_tool.deny]
style = "json"
# permissionDecision "deny" blocks the call; the reason goes to the model.
# systemMessage is shown to the person.
body = { hookSpecificOutput = { hookEventName = "PreToolUse", permissionDecision = "deny", permissionDecisionReason = "{agent_message}" }, systemMessage = "{user_message}" }

# An explicit allow, for a `vahta run` whose inner command the secret's own
# rules let through (docs read 2026-10-13, https://code.claude.com/docs/en/hooks).
# It skips the permission prompt; our permissions.deny and the harness's own
# protections still win over it. Whether it also skips the auto-mode classifier
# is not documented and is tested live in the bench. The reason is shown to the
# person, not to the model.
[replies.before_tool.allow_explicit]
style = "json"
body = { hookSpecificOutput = { hookEventName = "PreToolUse", permissionDecision = "allow", permissionDecisionReason = "{reason}" } }

[replies.before_read.deny]
style = "json"
body = { hookSpecificOutput = { hookEventName = "PreToolUse", permissionDecision = "deny", permissionDecisionReason = "{agent_message}" }, systemMessage = "{user_message}" }

[replies.prompt.deny]
style = "json"
# decision "block" stops the prompt from reaching the model and erases it from
# context; `reason` is shown to the person only.
body = { decision = "block", reason = "{user_message}" }

[replies.prompt.notice]
style = "json"
# A clean prompt may carry context for the model (docs read 2026-10-01,
# https://code.claude.com/docs/en/hooks: UserPromptSubmit additionalContext).
# Used once after the person saved a pasted secret and asked the agent to
# propose rules for it: the blocked prompt itself is erased from the context.
body = { hookSpecificOutput = { hookEventName = "UserPromptSubmit", additionalContext = "{agent_message}" }, systemMessage = "{user_message}" }

[replies.after_tool.notice]
style = "json"
# additionalContext is appended to what the model sees; systemMessage is shown
# to the person. We do not use decision "block": that would hide the result.
body = { hookSpecificOutput = { hookEventName = "PostToolUse", additionalContext = "{agent_message}" }, systemMessage = "{user_message}" }

# A result with secrets cut out of it (docs read 2026-10-06). updatedToolOutput
# replaces the result before the model sees it, and must keep the tool's own
# shape, so {redacted_output} is the result as the tool gave it with only its
# strings changed. additionalContext tells the model what was cut and how to
# ask. systemMessage is left out when the message is empty, which it is
# unless the daemon was not there to hold the original.
[replies.after_tool.redact]
style = "json"
body = { hookSpecificOutput = { hookEventName = "PostToolUse", updatedToolOutput = "{redacted_output}", additionalContext = "{agent_message}" }, systemMessage = "{user_message}" }

# An MCP tool's result, a string or an object. The docs now prefer
# updatedToolOutput for every tool; updatedMCPToolOutput is the field older
# versions know for MCP, and the current docs still accept it.
[replies.after_tool.redact_mcp]
style = "json"
body = { hookSpecificOutput = { hookEventName = "PostToolUse", updatedMCPToolOutput = "{redacted_output}", additionalContext = "{agent_message}" }, systemMessage = "{user_message}" }

# The exit-code alternative, for harnesses that cannot read JSON (not used by
# Claude today):
#   [replies.before_tool.deny]
#   style = "exit_code"
#   exit_code = 2
#   stderr = "{reason}"

# SessionStart: systemMessage is shown to the person (docs read 2026-10-01).
[replies.session_start.notice]
style = "json"
body = { systemMessage = "{user_message}" }
