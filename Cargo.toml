[workspace]
resolver = "3"
members = ["crates/detect", "crates/pyext"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Vahta contributors"]
repository = "https://github.com/vahta-team/vahta"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
